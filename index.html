<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="RUAS StudentOS — smart timetable, attendance, assignments and academic dashboard." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1220'/%3E%3Cpath d='M26 28h48v12H38v12h30v11H38v9h36v12H26z' fill='white'/%3E%3C/svg%3E" />
  <title>StudentOS — RUAS Academic Hub</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--accent2:#7c3aed;--good:#12b76a;--warn:#f79009;--bad:#f04438;--shadow:0 16px 40px rgba(16,24,40,.08);--radius:20px}
    [data-theme=dark]{--bg:#080b12;--panel:#111827;--panel2:#182234;--text:#f8fafc;--muted:#98a2b3;--line:#273244;--shadow:0 18px 50px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,rgba(124,58,237,.09),transparent 28%),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.03em}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;box-shadow:0 10px 24px rgba(79,70,229,.25)}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0}.top-actions{display:flex;gap:8px}.icon-btn,.ghost-btn,.primary-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px}.primary-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:0;font-weight:800}.ghost-btn:hover,.icon-btn:hover{background:var(--panel2)}.shell{max-width:1200px;margin:auto;padding:20px 18px 110px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin:10px 0 18px}.hero-card{background:linear-gradient(135deg,#111827,#1f2937);color:white;border-radius:28px;padding:26px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-120px;top:-140px;background:rgba(124,58,237,.35)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;opacity:.7;font-weight:800}.hero h1{font-size:clamp(28px,4vw,46px);line-height:1;margin:10px 0}.hero p{margin:0;color:#cbd5e1}.selector-card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow)}.selector-card label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.select-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:13px;outline:0}.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(16,24,40,.04)}.stat .num{font-size:24px;font-weight:900;margin-top:4px}.stat .label{color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:800}.nav button.active{background:var(--text);color:var(--panel);border-color:var(--text)}.view{display:none}.view.active{display:block}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:12px 0}.section-title h2{margin:0;font-size:24px;letter-spacing:-.03em}.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.day-tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.day-tabs button{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:800;white-space:nowrap}.day-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}.timeline{display:grid;gap:10px}.slot{display:grid;grid-template-columns:115px 1fr auto;gap:14px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 7px 22px rgba(16,24,40,.035)}.slot.live{border:2px solid var(--good);box-shadow:0 0 0 4px rgba(18,183,106,.09)}.slot.done{opacity:.55}.slot.next{border-color:var(--warn)}.time{font-weight:900;font-size:13px}.time small{display:block;color:var(--muted);font-weight:600;margin-top:4px}.subject{font-weight:900}.code{font-size:11px;color:var(--accent);font-weight:900;margin-top:3px}.meta{color:var(--muted);font-size:12px;margin-top:7px}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:999px;background:var(--panel2);font-size:10px;font-weight:900}.pill.live{background:rgba(18,183,106,.12);color:var(--good)}.pill.warn{background:rgba(247,144,9,.12);color:var(--warn)}.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(16,24,40,.04)}.card h3{margin:0 0 5px}.muted{color:var(--muted)}.progress{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.attendance-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.attendance-row:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:11px;font-weight:800}.mini.good{color:var(--good)}.mini.bad{color:var(--bad)}.mini.active{outline:2px solid var(--accent);outline-offset:1px}.task,.exam{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child,.exam:last-child{border-bottom:0}.check{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}.task.done .task-name{text-decoration:line-through;opacity:.5}.badge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:var(--panel2)}.badge.red{background:rgba(240,68,56,.12);color:var(--bad)}.badge.orange{background:rgba(247,144,9,.12);color:var(--warn)}.badge.green{background:rgba(18,183,106,.12);color:var(--good)}.assistant{display:grid;grid-template-columns:1fr 320px;gap:14px}.chat{min-height:420px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;display:grid;gap:10px;align-content:start;padding-bottom:12px}.bubble{max-width:85%;padding:11px 13px;border-radius:16px;background:var(--panel2);font-size:13px;line-height:1.5}.bubble.me{justify-self:end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.chat-form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.chat-form input{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px;outline:0}.source img{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff}.source-note{font-size:11px;color:var(--muted);margin-top:8px}.settings-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.switch{width:48px;height:28px;border-radius:999px;background:var(--panel2);padding:3px}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(20px);background:#fff}.toast{position:fixed;right:18px;bottom:86px;z-index:60;background:#111827;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:none;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}.bottom-nav button{background:transparent;color:var(--muted);font-size:10px;font-weight:900;padding:7px}.bottom-nav button.active{color:var(--accent)}.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:70;display:none;place-items:center;padding:18px}.modal.open{display:grid}.modal-card{width:min(520px,100%);background:var(--panel);border-radius:24px;padding:22px;border:1px solid var(--line);box-shadow:var(--shadow)}.form-grid{display:grid;gap:10px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.close-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.small{font-size:12px}.hidden{display:none!important}@media(max-width:850px){.hero{grid-template-columns:1fr}.status-grid{grid-template-columns:repeat(2,1fr)}.grid,.assistant{grid-template-columns:1fr}.bottom-nav{display:grid}.shell{padding-bottom:120px}.top-actions .label{display:none}.slot{grid-template-columns:90px 1fr}.slot>.slot-actions{grid-column:2}.slot .pill{align-self:start}}@media(max-width:520px){.shell{padding:14px 12px 115px}.topbar-inner{padding:11px 12px}.logo{width:38px;height:38px}.brand{font-size:14px}.hero-card,.selector-card{border-radius:22px}.hero-card{padding:20px}.select-row{grid-template-columns:1fr}.status-grid{gap:8px}.stat{padding:12px}.stat .num{font-size:20px}.slot{grid-template-columns:1fr;gap:7px}.slot>.slot-actions{grid-column:auto}.grid{gap:10px}.card{padding:15px}}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<script src="data.js"></script>
<script>
const STORE='studentos-v1';
const state=JSON.parse(localStorage.getItem(STORE)||'{}');
state.theme ||= 'light'; state.section ||= 'CSE-B'; state.day ||= new Date().toLocaleDateString('en-US',{weekday:'long'}); state.view ||= 'home';
state.attendance ||= {}; state.tasks ||= defaultTasks(); state.exams ||= defaultExams(); state.notifications ??= true; state.profile ||= {name:'Student',roll:'',dept:'CSE',sem:'3rd'};
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;render();});
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2200)}
function defaultTasks(){return [{id:1,name:'DSA practice set',subject:'CSD201B',due:'Tomorrow',done:false},{id:2,name:'Logic Design lab record',subject:'CSD202B',due:'Friday',done:false},{id:3,name:'Probability revision',subject:'MTE301B',due:'Next week',done:true}]}
function defaultExams(){return [{name:'Internal Assessment — 1',date:'Set exam date in Settings',type:'Internal'},{name:'End Semester Examination',date:'Set exam date in Settings',type:'Semester'}]}
function sectionMeta(){return SECTIONS[state.section]||SECTIONS['CSE-B']}
function currentDay(){return DAYS.includes(state.day)?state.day:'Monday'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function minutes(t){const [a,b]=t.split(':').map(Number);return a*60+b}
function parseRange(range){const [a,b]=range.split('–');const p=s=>{let [h,m]=s.split(':').map(Number);return h*60+m};return [p(a),p(b)]}
function nowMins(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function timeLabel(range){return range}
function statusFor(range,day){if(day!==new Date().toLocaleDateString('en-US',{weekday:'long'}))return '';const n=nowMins(),[a,b]=parseRange(range);if(n>=a&&n<b)return 'live';if(n<b)return 'next';if(n>=b)return 'done';return ''}
function render(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';document.getElementById('app').innerHTML=layout();bind();}
function layout(){const s=sectionMeta();const today=new Date().toLocaleDateString('en-US',{weekday:'long'});return `
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">S</div><div>StudentOS<small>RUAS • 3rd Semester Hub</small></div></div><div class="top-actions"><button class="icon-btn" id="installBtn">⬇️ <span class="label">Install</span></button><button class="icon-btn" id="themeBtn">${state.theme==='dark'?'☀️':'🌙'}</button></div></div></header>
<main class="shell">
<section class="hero"><div class="hero-card"><div class="eyebrow">${today===state.day?'Today':'Selected day'}</div><h1>${escapeHtml(state.profile.name||'Student')} 👋</h1><p>${escapeHtml(s.name)} • ${s.semester} • ${s.block||'Academic timetable'}</p><div style="margin-top:18px"><span class="pill live">● SMART CAMPUS MODE</span></div></div><div class="selector-card"><label>My section</label><div class="select-row"><select class="select" id="deptSel"><option value="CSE">CSE</option><option value="AIML">AIML</option><option value="ISE">ISE</option></select><select class="select" id="sectionSel">${sectionOptions()}</select></div><div class="small muted" style="margin-top:10px">Imported from the supplied 3rd-semester timetable.</div></div></section>
<div class="status-grid">${stats()}</div>
<nav class="nav">${[['home','🏠 Home'],['timetable','📅 Timetable'],['attendance','📊 Attendance'],['tasks','📝 Tasks'],['exams','🗓 Exams'],['assistant','🤖 Assistant'],['settings','⚙️ Settings']].map(([v,l])=>`<button class="${state.view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</nav>
${viewHome()}${viewTimetable()}${viewAttendance()}${viewTasks()}${viewExams()}${viewAssistant()}${viewSettings()}
</main><nav class="bottom-nav">${[['home','⌂','Home'],['timetable','▦','Timetable'],['attendance','◔','Attendance'],['tasks','✓','Tasks'],['settings','⚙','More']].map(([v,i,l])=>`<button class="${state.view===v?'active':''}" data-view="${v}">${i}<br>${l}</button>`).join('')}</nav>`}
function sectionOptions(){const dept=state._dept||state.profile.dept||'CSE';const prefix=dept;return Object.entries(SECTIONS).filter(([k])=>k.startsWith(prefix+'-')).map(([k,v])=>`<option value="${k}" ${state.section===k?'selected':''}>Section ${k.split('-')[1]} — ${v.program}</option>`).join('')}
function stats(){const att=attendanceSummary();const day=state.day;const entries=TIMETABLE[state.section]?.[day]||[];const live=entries.find(e=>statusFor(e.time,day)==='live');const next=entries.find(e=>statusFor(e.time,day)==='next');return `<div class="stat"><div class="label">Today</div><div class="num">${entries.length}</div><div class="label">scheduled classes</div></div><div class="stat"><div class="label">Attendance</div><div class="num">${att.overall}%</div><div class="label">personal record</div></div><div class="stat"><div class="label">${live?'Live now':'Next class'}</div><div class="num" style="font-size:17px">${escapeHtml((live||next)?.subject?.split(' / ')[0]||'Free')}</div><div class="label">${(live||next)?.time||'No class'}</div></div><div class="stat"><div class="label">Pending tasks</div><div class="num">${state.tasks.filter(x=>!x.done).length}</div><div class="label">keep your week clear</div></div>`}
function sectionTitle(title,sub,actions=''){return `<div class="section-title"><div><h2>${title}</h2><p>${sub}</p></div>${actions}</div>`}
function viewHome(){if(state.view!=='home')return '';const day=state.day;const entries=TIMETABLE[state.section]?.[day]||[];const live=entries.find(e=>statusFor(e.time,day)==='live');const next=entries.find(e=>statusFor(e.time,day)==='next');return `<section class="view active">${sectionTitle('Your day',`${day} • ${sectionMeta().name}`,`<button class="primary-btn" id="todayBtn">Back to today</button>`)}<div class="grid"><div class="card"><h3>${live?'🟢 Live now':next?'⏭️ Up next':'✨ Schedule'}</h3><p class="muted">${escapeHtml((live||next)?.subject||'No active class right now.')}</p><div class="actions"><span class="pill">${(live||next)?.time||'Free period'}</span><span class="pill">${escapeHtml((live||next)?.room||'')}</span></div></div><div class="card"><h3>⚡ Smart summary</h3><p class="muted">${smartSummary(entries)}</p><button class="ghost-btn" id="askSummary">Ask assistant</button></div></div><div style="margin-top:14px">${sectionTitle('Today at a glance','Tap a class for details')}</div><div class="timeline">${entries.length?entries.map(slotCard).join(''):`<div class="empty">No classes scheduled for ${day}. Enjoy your free day.</div>`}</div></section>`}
function smartSummary(entries){if(!entries.length)return 'You have no scheduled classes today.';const labs=entries.filter(e=>/lab/i.test(e.subject)).length;return `${entries.length} scheduled session${entries.length>1?'s':''}${labs?`, including ${labs} lab block${labs>1?'s':''}`:''}. ${nextFree(entries)}`}
function nextFree(entries){const ranges=entries.map(e=>parseRange(e.time)).sort((a,b)=>a[0]-b[0]);let gaps=[];for(let i=1;i<ranges.length;i++){if(ranges[i][0]-ranges[i-1][1]>=30)gaps.push(`${fmtMin(ranges[i-1][1])}–${fmtMin(ranges[i][0])}`)}return gaps.length?`Free window: ${gaps[0]}.`:'No long free window detected.'}
function fmtMin(m){const h=Math.floor(m/60),mm=m%60;return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function viewTimetable(){if(state.view!=='timetable')return '';return `<section class="view active">${sectionTitle('Timetable','Full week • live status updates')}<div class="day-tabs">${DAYS.map(d=>`<button class="${state.day===d?'active':''}" data-day="${d}">${d.slice(0,3)}</button>`).join('')}</div><div class="timeline">${(TIMETABLE[state.section]?.[state.day]||[]).map(slotCard).join('')||'<div class="empty">No classes scheduled.</div>'}</div><div class="card source" style="margin-top:14px"><h3>📄 Imported source</h3><p class="source-note">This section is imported from the supplied 3rd-semester timetable PDF. Faculty names are intentionally omitted from the public app. Use the original PDF to cross-check official changes.</p><div class="pill">PDF page: ${sectionMeta().page.toUpperCase()}</div></div></section>`}
function slotCard(e){const st=statusFor(e.time,state.day);return `<article class="slot ${st}"><div class="time">${e.time}<small>${st==='live'?'LIVE NOW':st==='next'?'NEXT':st==='done'?'COMPLETED':'Scheduled'}</small></div><div><div class="subject">${escapeHtml(e.subject)}</div><div class="code">${escapeHtml(e.code||'—')}</div><div class="meta">📍 ${escapeHtml(e.room||'Room not specified')} ${e.batch?` • Batch ${escapeHtml(e.batch)}`:''}</div></div><div class="slot-actions">${st==='live'?'<span class="pill live">● LIVE</span>':st==='next'?'<span class="pill warn">NEXT</span>':''}</div></article>`}
function viewAttendance(){if(state.view!=='attendance')return '';const a=attendanceSummary();return `<section class="view active">${sectionTitle('Attendance intelligence','Personal record — never assumes attendance')}<div class="grid"><div class="card"><div class="eyebrow muted">Overall</div><div style="font-size:44px;font-weight:900;margin:4px 0">${a.overall}%</div><div class="progress"><i style="width:${a.overall}%"></i></div><p class="muted">${a.overall>=75?'You are above the 75% target.':'You are below the 75% target.'}</p></div><div class="card"><h3>How it works</h3><p class="muted">After a class, record <b>Present</b>, <b>Absent</b>, or leave it <b>Not Recorded</b>. Nothing is guessed automatically.</p><button class="primary-btn" id="recordToday">Record today</button></div></div><div class="card" style="margin-top:14px"><h3>Subject breakdown</h3>${a.subjects.map(x=>attendanceSubject(x)).join('')}</div></section>`}
function attendanceSummary(){const map={};Object.values(TIMETABLE[state.section]||{}).flat().forEach(e=>{const key=e.code||e.subject;if(!map[key])map[key]={key,subject:e.subject,present:0,absent:0,total:0};const rec=state.attendance[attendanceKey(e)];if(rec){map[key][rec]++;map[key].total++}});const vals=Object.values(map);let p=vals.reduce((s,x)=>s+x.present,0),t=vals.reduce((s,x)=>s+x.total,0);return {overall:t?Math.round(p/t*100):0,subjects:vals.map(x=>({...x,pct:x.total?Math.round(x.present/x.total*100):null,needed:needFor75(x.present,x.total)}))}}
function needFor75(p,t){if(!t)return 0;let n=0;while((p+n)/(t+n)<.75&&n<100)n++;return n}
function attendanceSubject(x){const pct=x.pct;return `<div class="attendance-row"><div><b>${escapeHtml(x.subject.split(' / ')[0])}</b><div class="muted small">${escapeHtml(x.key)} • ${x.present} present • ${x.absent} absent • ${x.total-x.present-x.absent} not recorded</div>${pct!==null?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}</div><div style="text-align:right"><b>${pct===null?'—':pct+'%'}</b><div class="actions" style="margin-top:6px"><button class="mini good" data-mark="present" data-code="${escapeHtml(x.key)}">+ Present</button><button class="mini bad" data-mark="absent" data-code="${escapeHtml(x.key)}">+ Absent</button></div></div></div>`}
function attendanceKey(e){return `${state.section}|${state.day}|${e.time}|${e.code}`}
function viewTasks(){if(state.view!=='tasks')return '';return `<section class="view active">${sectionTitle('Tasks','Assignments and personal study queue',`<button class="primary-btn" id="addTask">+ Add task</button>`)}<div class="card">${state.tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-task="${t.id}">${t.done?'✓':''}</button><div style="flex:1"><div class="task-name"><b>${escapeHtml(t.name)}</b></div><div class="muted small">${escapeHtml(t.subject)} • due ${escapeHtml(t.due)}</div></div><span class="badge ${t.done?'green':'orange'}">${t.done?'DONE':'PENDING'}</span></div>`).join('')}</div></section>`}
function viewExams(){if(state.view!=='exams')return '';return `<section class="view active">${sectionTitle('Exams & calendar','Keep important academic dates visible')}<div class="grid"><div class="card"><h3>Upcoming</h3>${state.exams.map(e=>`<div class="exam"><div><b>${escapeHtml(e.name)}</b><div class="muted small">${escapeHtml(e.type)}</div></div><span class="badge">${escapeHtml(e.date)}</span></div>`).join('')}</div><div class="card"><h3>Academic planning</h3><p class="muted">Use this area for internal exams, end-semester exams, holidays, assignment deadlines and college events.</p><button class="primary-btn" id="addExam">+ Add date</button></div></div></section>`}
function viewAssistant(){if(state.view!=='assistant')return '';return `<section class="view active">${sectionTitle('Academic Assistant','Local, data-grounded assistant for your timetable and personal records')}<div class="assistant"><div class="card chat"><div class="messages" id="messages"><div class="bubble">Hi! Ask me things like <b>“What is my next class?”</b>, <b>“How is my attendance?”</b>, or <b>“What do I have on Thursday?”</b>.</div></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="Ask about your academic day…" autocomplete="off"><button class="primary-btn">Send</button></form></div><div class="card"><h3>Try these</h3><div class="actions" style="margin-top:10px"><button class="mini quick">Next class</button><button class="mini quick">Attendance</button><button class="mini quick">Thursday timetable</button><button class="mini quick">Free period today</button></div></div></div></section>`}
function assistantAnswer(q){const x=q.toLowerCase();if(x.includes('next class')){const es=TIMETABLE[state.section]?.[state.day]||[];const n=es.find(e=>statusFor(e.time,state.day)==='live'||statusFor(e.time,state.day)==='next');return n?`${n.subject} at ${n.time}, ${n.room}.`:'There is no upcoming class in the current schedule.'}if(x.includes('attendance')){const a=attendanceSummary();return `Your personal attendance record is ${a.overall}%. Remember: Not Recorded is different from Absent, and the app never guesses.`}if(x.includes('free')){return smartSummary(TIMETABLE[state.section]?.[state.day]||[])}for(const d of DAYS){if(x.includes(d.toLowerCase())){return `${d}: ${(TIMETABLE[state.section]?.[d]||[]).map(e=>`${e.time} — ${e.subject}`).join('; ')||'No classes scheduled.'}`}}if(x.includes('today'))return smartSummary(TIMETABLE[state.section]?.[state.day]||[]);return 'I can answer timetable, attendance, task and exam questions using the data stored in this app.'}
function viewSettings(){if(state.view!=='settings')return '';return `<section class="view active">${sectionTitle('Settings','Personalize StudentOS')}<div class="grid"><div class="card"><h3>Profile</h3><div class="form-grid"><input id="nameInput" value="${escapeHtml(state.profile.name||'')}" placeholder="Name"><input id="rollInput" value="${escapeHtml(state.profile.roll||'')}" placeholder="Roll number (optional)"><button class="primary-btn" id="saveProfile">Save profile</button></div></div><div class="card"><h3>Preferences</h3><div class="settings-row"><div><b>Dark mode</b><div class="muted small">Comfortable night UI</div></div><button class="switch ${state.theme==='dark'?'on':''}" id="themeSwitch"><i></i></button></div><div class="settings-row"><div><b>Class reminders</b><div class="muted small">UI preference for future push notifications</div></div><button class="switch ${state.notifications?'on':''}" id="notifySwitch"><i></i></button></div><div class="settings-row"><div><b>Install app</b><div class="muted small">Add StudentOS to Android home screen</div></div><button class="primary-btn" id="installSettings">Install</button></div></div></div><div class="card" style="margin-top:14px"><h3>Data & privacy</h3><p class="muted">This demo stores personal profile, attendance and tasks in this browser only. No faculty names are included in the public data model.</p><button class="ghost-btn" id="resetData">Reset local data</button></div></section>`}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;state.view='timetable';save();render()});const dept=document.getElementById('deptSel');if(dept){dept.value=state.section.split('-')[0];dept.onchange=()=>{state.section=dept.value+'-A';save();render()}}const ss=document.getElementById('sectionSel');if(ss)ss.onchange=()=>{state.section=ss.value;save();render()};document.getElementById('todayBtn')?.addEventListener('click',()=>{state.day=new Date().toLocaleDateString('en-US',{weekday:'long'});save();render()});document.getElementById('themeBtn')?.addEventListener('click',toggleTheme);document.getElementById('themeSwitch')?.addEventListener('click',toggleTheme);document.getElementById('notifySwitch')?.addEventListener('click',()=>{state.notifications=!state.notifications;save();render()});document.getElementById('installBtn')?.addEventListener('click',install);document.getElementById('installSettings')?.addEventListener('click',install);document.getElementById('saveProfile')?.addEventListener('click',()=>{state.profile.name=document.getElementById('nameInput').value.trim()||'Student';state.profile.roll=document.getElementById('rollInput').value.trim();save();toast('Profile saved');render()});document.getElementById('resetData')?.addEventListener('click',()=>{if(confirm('Reset your local StudentOS data?')){localStorage.removeItem(STORE);location.reload()}});document.getElementById('addTask')?.addEventListener('click',addTask);document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id==b.dataset.task);t.done=!t.done;save();render()});document.getElementById('addExam')?.addEventListener('click',addExam);document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>markSubject(b.dataset.code,b.dataset.mark));document.getElementById('recordToday')?.addEventListener('click',recordToday);document.getElementById('askSummary')?.addEventListener('click',()=>{state.view='assistant';save();render()});document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>sendQuick(b.textContent));document.getElementById('chatForm')?.addEventListener('submit',e=>{e.preventDefault();const inp=document.getElementById('chatInput');sendQuick(inp.value);inp.value=''})}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();render()}
async function install(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else toast('On Android Chrome: ⋮ → Add to Home screen')}
function addTask(){const name=prompt('Task name');if(!name)return;const subject=prompt('Subject/code','General')||'General';const due=prompt('Due date','This week')||'This week';state.tasks.unshift({id:Date.now(),name,subject,due,done:false});save();render()}
function addExam(){const name=prompt('Exam/event name');if(!name)return;const date=prompt('Date','TBD')||'TBD';state.exams.push({name,date,type:'Academic'});save();render()}
function markSubject(code,mark){const e=(TIMETABLE[state.section]?.[state.day]||[]).find(x=>(x.code||x.subject)===code);if(!e)return;state.attendance[attendanceKey(e)]=mark;save();toast(mark==='present'?'Marked present':'Marked absent');render()}
function recordToday(){
 const today=new Date().toLocaleDateString('en-US',{weekday:'long'});
 const es=TIMETABLE[state.section]?.[today]||[];
 if(!es.length){toast('No classes today');return}
 state.day=today;
 const html=es.map(item=>{
   const payload=encodeURIComponent(JSON.stringify(item));
   return `<div class=\"attendance-row\"><div><b>${escapeHtml(item.subject)}</b><div class=\"muted small\">${item.time} • ${item.room}</div></div><div class=\"actions\"><button class=\"mini good\" data-r=\"${payload}\" data-v=\"present\">Present</button><button class=\"mini bad\" data-r=\"${payload}\" data-v=\"absent\">Absent</button></div></div>`;
 }).join('');
 openModal(`<div class=\"close-row\"><h3>Record today's classes</h3><button class=\"icon-btn\" id=\"closeModal\">✕</button></div>${html}<p class=\"muted small\">Anything you don't mark remains Not Recorded.</p>`);
 document.querySelectorAll('[data-r]').forEach(btn=>btn.onclick=()=>{
   const item=JSON.parse(decodeURIComponent(btn.dataset.r));
   state.attendance[attendanceKey(item)]=btn.dataset.v;
   save(); toast('Attendance saved'); closeModal(); render();
 });
 document.getElementById('closeModal').onclick=closeModal;
}

function sendQuick(q){if(!q)return;const m=document.getElementById('messages');if(!m)return;m.insertAdjacentHTML('beforeend',`<div class="bubble me">${escapeHtml(q)}</div><div class="bubble">${escapeHtml(assistantAnswer(q))}</div>`);m.scrollTop=m.scrollHeight}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-card">${html}</div>`;m.classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')}
setInterval(()=>{if(state.view==='home'||state.view==='timetable'){const active=document.querySelector('.view.active');if(active){const y=window.scrollY;render();window.scrollTo(0,y)}}},30000);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
